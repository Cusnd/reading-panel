name: Bug Report / 问题反馈
description: Report a bug or unexpected behavior in Reading Panel
labels: ["bug"]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition / 版本
      options:
        - Offline (ECDICT + Piper)
        - Online (Chinese Wiktionary)
        - Built from source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows Version & Reader App / 系统与阅读软件
      placeholder: "e.g. Windows 11 24H2, Chrome / Edge / Acrobat / Zed / WeChat"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description / 问题描述
      description: What happened vs. what you expected to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce / 复现步骤
      placeholder: |
        1. Select text in ...
        2. Middle-click or press Ctrl+Alt+L ...
        3. Observe ...
    validations:
      required: true

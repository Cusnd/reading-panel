name: Feature Request / 功能建议
description: Suggest an improvement, reader integration, or new provider
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case / 使用场景
      description: What reading workflow problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / 期望方案
      description: Describe the behavior, UI, or provider integration you have in mind.
    validations:
      required: true
